plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oai.wechatreadonly'
    compileSdk 35

    defaultConfig {
        applicationId "com.oai.wechatreadonly.v03"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "0.3.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
