plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oai.wechatreadonly'
    compileSdk 35

    defaultConfig {
        applicationId "com.oai.wechatreadonly.v04"
        minSdk 30
        targetSdk 35
        versionCode 4
        versionName "0.4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
