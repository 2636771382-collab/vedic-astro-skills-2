name: Export public Vedic calculator source

on:
  workflow_dispatch:
  push:
    branches: ["audit-native-2026-10-25"]
    paths:
      - ".github/workflows/vedic-source-package.yml"

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive without personal files
        run: tar -czf vedic-calculator-source.tar.gz skills/vedic-calculator/
      - uses: actions/upload-artifact@v4
        with:
          name: vedic-calculator-sources-public
          path: vedic-calculator-source.tar.gz
          retention-days: 2
