name: Package offline PyJHora runtime (Python 3.13)

on:
  workflow_dispatch:
  push:
    branches: ["audit-native-2026-10-25"]
    paths:
      - ".github/workflows/vedic-offline-wheels.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download packages needed for offline installation
        run: |
          mkdir -p wheelhouse
          python -m pip download --dest wheelhouse --prefer-binary \
            "PyJHora==4.8.6" "pysweph>=2.10.3.5" "pytz>=2024.1" \
            "numpy" "geocoder" "geopy" "requests" "timezonefinder" \
            "python-dateutil" "tzdata" "wheel" "setuptools"
          ls -lh wheelhouse/
      - name: Upload wheelhouse for offline private calculation
        uses: actions/upload-artifact@v4
        with:
          name: pyjhora-python313-offline
          path: wheelhouse/
          retention-days: 2
          if-no-files-found: error
