name: Build WeChat Readonly Mobile APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-wechat-mobile-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile source branch
        uses: actions/checkout@v4
        with:
          ref: codex

      - name: Configure v0.7.1 1500-page build
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('wechat-readonly-mobile/app/src/main/java/com/oai/wechatreadonly/MainActivity.java')
          s = main.read_text(encoding='utf-8')
          s = s.replace('微信只读索引 · v0.7 视觉证据版', '微信只读索引 · v0.7.1 视觉证据版 · 1500页')
          s = s.replace('无人值守最大翻页数，默认500', '无人值守最大翻页数，默认1500')
          s = s.replace('pages.setText("500");', 'pages.setText("1500");')
          s = s.replace('int n = 500;', 'int n = 1500;')
          s = s.replace('_wechat_v07_evidence.zip', '_wechat_v071_evidence.zip')
          s = s.replace('_wechat_v07.jsonl', '_wechat_v071.jsonl')
          s = s.replace('v0.7 JSONL已导出', 'v0.7.1 JSONL已导出')
          s = s.replace('v0.7完整证据ZIP已导出', 'v0.7.1完整证据ZIP已导出')
          main.write_text(s, encoding='utf-8')

          service = Path('wechat-readonly-mobile/app/src/main/java/com/oai/wechatreadonly/WeChatEventSourceService.java')
          s = service.read_text(encoding='utf-8')
          s = s.replace('Math.min(800, pages)', 'Math.min(1500, pages)')
          service.write_text(s, encoding='utf-8')

          gradle = Path('wechat-readonly-mobile/app/build.gradle')
          s = gradle.read_text(encoding='utf-8')
          s = s.replace('applicationId "com.oai.wechatreadonly.v07"', 'applicationId "com.oai.wechatreadonly.v071"')
          s = s.replace('versionCode 7', 'versionCode 71')
          s = s.replace('versionName "0.7.0"', 'versionName "0.7.1"')
          gradle.write_text(s, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: wechat-readonly-mobile
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wechat-readonly-mobile-v0.7.1-visual-evidence-1500
          path: wechat-readonly-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# rebuild marker: v0.7.1-visual-evidence-1500
